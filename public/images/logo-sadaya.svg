<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sadayaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#sadayaGrad)" stroke="#10b981" stroke-width="2"/>
  
  <!-- Emblem / Building & Shield Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pediment / Roof -->
    <path d="M 34 46 L 60 26 L 86 46 Z" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Pillars -->
    <line x1="42" y1="46" x2="42" y2="58"/>
    <line x1="60" y1="46" x2="60" y2="58"/>
    <line x1="78" y1="46" x2="78" y2="58"/>
    <!-- Base -->
    <line x1="32" y1="58" x2="88" y2="58" stroke-width="4.5"/>
  </g>

  <!-- Verified Check / Star Accent -->
  <circle cx="60" cy="42" r="5" fill="url(#goldGrad)" stroke="#064e3b" stroke-width="1.5"/>

  <!-- SADAYA Typography -->
  <text x="60" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.5">SADAYA</text>
  
  <!-- PBB Tag Badge -->
  <rect x="40" y="88" width="40" height="16" rx="5" fill="#10b981"/>
  <text x="60" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="2">PBB</text>
</svg>
